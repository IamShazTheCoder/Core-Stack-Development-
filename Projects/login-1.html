<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="login-1.css">
</head>

<body>

<div class="container">

    <h1>Log in</h1>

    <p>
        Need a Mailchimp account?
        <a href="#">Create an account</a>
    </p>

    <form>

        <div class="form-group">

            <label for="email">Username or Email</label>

            <input
                id="email"
                type="email"
                placeholder="johndoe@gmail.com"
                required>

        </div>

        <div class="form-group">

            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                placeholder="Enter password"
                required>

        </div>

        <div class="checkbox">

            <input
                id="remember"
                type="checkbox">

            <label for="remember">
                Keep me logged in
            </label>

        </div>

        <button type="submit">
            Log in
        </button>

    </form>

    <div class="links">

        <a href="#">Forgot username?</a>
        <a href="#">Forgot password?</a>
        <a href="#">Can't log in?</a>

    </div>

</div>

</body>
</html>
