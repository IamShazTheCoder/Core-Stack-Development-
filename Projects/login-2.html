<html>

    <head>
        <title>Login-Page</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="login-2.css">
    </head>

    <body>
        <div class="container">
            <h1>Login</h1>

            <div class="form-group">
            <input class="input-box" type="email" required placeholder="Email">
            </div>

            <div class="form-group">
                <input class="input-box" type="password" required placeholder="Password">
            </div>

            <div>
                <input type="checkbox"> <span class="text">Keep me login</span>
            </div>

            <div class="form-group">
                <button class="button-style" type="submit">SignIn</button>
            </div>

            <p class="text">Forgot <a href="#">Username / Password</a></p>
            <p class="text">Dont have an account? <a href="#">Sign Up</a></p>
        </div>
    </body>

</html>
